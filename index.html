const fmtDate=d=>d.toISOString().split("T")[0];
const fmtTime=d=>{const h=String(d.getHours()).padStart(2,"0"),m=String(d.getMinutes()).padStart(2,"0");return`${h}:${m}`;};
const todayStr=()=>fmtDate(new Date());
const getLabel=ds=>{const t=todayStr(),y=fmtDate(new Date(Date.now()-86400000));if(ds===t)return"Today";if(ds===y)return"Yesterday";return new Date(ds+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});};

const lsGet=(k,def)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

// ─── TASK RESOLUTION ─────────────────────────────────────────────────────────
// Merge default tasks with user overrides stored in localStorage
function useTaskLibrary(){
  const[overrides,setOverrides]=useState(()=>lsGet("taskOverrides",{}));
  const[customTasks,setCustomTasks]=useState(()=>lsGet("customTasks",[]));
  const[customSupps,setCustomSupps]=useState(()=>lsGet("customSupplements2",[]));

  const save=(ov,ct,cs)=>{
    lsSet("taskOverrides",ov);
    lsSet("customTasks",ct);
    lsSet("customSupplements2",cs);
  };

  const resolvedTasks=DEFAULT_TASKS.map(t=>({...t,...(overrides[t.id]||{})}));
  const allTasks=[...resolvedTasks,...customTasks,...customSupps.filter(s=>s.active!==false)];

  const updateTask=(id,changes)=>{
    const ov={...overrides,[id]:{...(overrides[id]||{}), ...changes}};
    setOverrides(ov);
    save(ov,customTasks,customSupps);
  };

  const addCustomTask=(task)=>{
    const ct=[...customTasks,task];
    setCustomTasks(ct);
    save(overrides,ct,customSupps);
  };

  const addCustomSupp=(supp)=>{
    const cs=[...customSupps,supp];
    setCustomSupps(cs);
    save(overrides,customTasks,cs);
  };

  const updateCustomSupp=(id,changes)=>{
    const cs=customSupps.map(s=>s.id===id?{...s,...changes}:s);
    setCustomSupps(cs);
    save(overrides,customTasks,cs);
  };

  const deleteCustomSupp=(id)=>{
    const cs=customSupps.filter(s=>s.id!==id);
    setCustomSupps(cs);
    save(overrides,customTasks,cs);
  };

  const archiveTask=(id)=>updateTask(id,{archived:true});
  const restoreTask=(id)=>{
    const ov={...overrides};
    if(ov[id])delete ov[id].archived;
    setOverrides(ov);
    save(ov,customTasks,customSupps);
  };

  return{allTasks,resolvedTasks,customTasks,customSupps,updateTask,addCustomTask,addCustomSupp,updateCustomSupp,deleteCustomSupp,archiveTask,restoreTask,overrides};
}

// ─── TIMER HOOK ─────────────────────────────────────────────────────────────
function useTimer(secs){
  const[s,setS]=useState(secs);const[run,setRun]=useState(false);const r=useRef(null);
  useEffect(()=>{
    if(run&&s>0){r.current=setInterval(()=>setS(x=>x-1),1000);}
    else{clearInterval(r.current);if(s===0)setRun(false);}
    return()=>clearInterval(r.current);
  },[run,s]);
  const fmt=x=>`${String(Math.floor(x/60)).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`;
  return{display:fmt(s),running:run,done:s===0,start:()=>setRun(true),pause:()=>setRun(false),reset:()=>{setRun(false);setS(secs);}};
}

  const subs=(task.substitutions||[]).map(sid=>allTasks.find(t=>t.id===sid)).filter(Boolean);
  return(
    <>
      <div className={`shov${open?" open":""}`} onClick={onClose}/>

// ─── TIME BLOCK ──────────────────────────────────────────────────────────────
function TimeBlock({block,tasks,dayData,blockOpen,onToggle,onComplete,onUndo,onSheet,onSymChange,onSymSave}){
  const blockTasks=tasks.filter(t=>t.block===block.id&&!t.hidden&&!t.archived);
  const mand=blockTasks.filter(t=>t.priority==="mandatory"&&t.category!=="tracking");
  const comp=mand.filter(t=>dayData.completed?.[t.id]);
  const pct=mand.length>0?Math.round((comp.length/mand.length)*100):0;
  const allDone=pct===100&&mand.length>0;
  const open=blockOpen[block.id]!==undefined?blockOpen[block.id]:(block.id==="morning"||block.id==="midday");

  return(
    <div className="tblk">
      <div className="bh" onClick={onToggle}>
        <div className="bhf" style={{transform:`scaleX(${pct/100})`}}/>
        <div className="bhl">
          <span className="be">{block.emoji}</span>
          <div><div className="btl">{block.label}</div><div className="bti">{block.time}</div></div>
        </div>
        <div className="bhr">
          <span className={`bpill${allDone?" dn":""}`}>{allDone?"✓ Done":`${comp.length}/${mand.length}`}</span>
          <span className={`bc${open?" op":""}`}>▼</span>
        </div>
      </div>
      {open&&(
        <div className="bts">
          {blockTasks.map(task=>{
            if(task.category==="tracking"){
              const done=dayData.completed?.[task.id];
              const fields=task.id==="sym-morning"?MF:task.id==="sym-midday"?DF:EF;
              if(done)return(
                <div key={task.id} style={{display:"flex",borderRadius:11,overflow:"hidden",marginBottom:8,border:"1px solid rgba(74,107,74,.2)"}}>
                  <div style={{width:50,background:DONE_PANEL,display:"flex",alignItems:"center",justifyContent:"center",fontSize:".85rem",color:"rgba(255,255,255,.9)"}}>✓</div>
                  <div style={{flex:1,background:DONE_BG,padding:"7px 11px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <span style={{fontSize:".74rem",color:"var(--mu)",textDecoration:"line-through"}}>{task.name}</span>
                    <button className="tmin-undo" onClick={()=>onUndo(task.id)}>undo</button>

              );
              return<SymLog key={task.id} title={task.name} fields={fields} data={dayData.symptoms||{}} onChange={onSymChange} onSave={()=>onSymSave(task.id)}/>;
            }
            const done=dayData.completed?.[task.id];
            const time=dayData.times?.[task.id];
            return<TaskCard key={task.id} task={task} done={done} time={time} onComplete={()=>onComplete(task.id)} onUndo={()=>onUndo(task.id)} onSheet={()=>onSheet(task)}/>;
          })}
        </div>
      )}
    </div>
  );
}

// ─── WEEKLY SUMMARY ──────────────────────────────────────────────────────────
function WeekTab({allData}){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(Date.now()-i*86400000);const ds=fmtDate(d);
    const data=allData[ds]||{completed:{},symptoms:{}};
    const mand=DEFAULT_TASKS.filter(t=>t.priority==="mandatory"&&t.category!=="tracking");
    const comp=mand.filter(t=>data.completed?.[t.id]);
    const pct=mand.length>0?Math.round((comp.length/mand.length)*100):0;
    days.push({ds,label:d.toLocaleDateString("en-GB",{weekday:"short"}),pct,sym:data.symptoms||{}});
  }
  const keys=[{key:"fog",label:"Fog",color:"#7A9BB5"},{key:"energy",label:"Energy",color:"#6B8F6B"},{key:"tension",label:"Tension",color:"#8B4A2A"},{key:"sleepQuality",label:"Sleep",color:"#9B8BB4"},{key:"mood",label:"Mood",color:"#7A6230"}];
  return(
    <div className="ref">
      <div className="ph"><div className="ptl">Weekly Summary</div><div className="ps">Last 7 days</div></div>
      <div className="rc3">
        <div className="rct">Protocol Completion</div>
        <div className="wg" style={{marginTop:10}}>
          {days.map(day=>(
            <div key={day.ds} className="wdc">
              <div className="wdl">{day.label}</div>
              <div className="wdb"><div className="wbf" style={{height:`${day.pct}%`,background:day.pct>70?"#4A6B4A":day.pct>40?"#7A6230":"#8B4A2A"}}/></div>
              <div className="wdp">{day.pct}%</div>
            </div>
          ))}
        </div>
      </div>
      {keys.map(sk=>{
        const vals=days.map(d=>d.sym[sk.key]?Number(d.sym[sk.key]):null);
        if(!vals.some(v=>v!==null))return null;
        const w=100/7,pts=vals.map((v,i)=>v!==null?`${i*w+w/2},${((5-v)/4)*56+8}`:null).filter(Boolean);
        return(
          <div key={sk.key} className="sch3">
            <div className="ctl">{sk.label}</div>
            <div className="cls">
              <svg className="csvg" viewBox="0 0 100 72" preserveAspectRatio="none">
                {[1,2,3,4,5].map(v=><line key={v} x1="0" y1={((5-v)/4)*56+8} x2="100" y2={((5-v)/4)*56+8} stroke="rgba(36,28,20,.1)" strokeWidth="0.5"/>)}
                {pts.length>1&&<polyline points={pts.join(" ")} fill="none" stroke={sk.color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>}
                {vals.map((v,i)=>v!==null?<circle key={i} cx={i*w+w/2} cy={((5-v)/4)*56+8} r="2.5" fill={sk.color}/>:null)}
              </svg>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── SETTINGS TAB ────────────────────────────────────────────────────────────
function SetTab({allData,customSupps,taskOverrides,customTasks}){
  const expCSV=()=>{
    const rows=[["Date","Task","Completed","Time","Comment","Fog","Energy","Tension","Sleep","Mood","HRV","RHR"]];
    Object.entries(allData).forEach(([date,data])=>{
      DEFAULT_TASKS.forEach(t=>{
        if(data.completed?.[t.id])rows.push([date,t.name,"Yes",data.times?.[t.id]||"",data.comments?.[t.id]||"",data.symptoms?.fog||"",data.symptoms?.energy||"",data.symptoms?.tension||"",data.symptoms?.sleepQuality||"",data.symptoms?.mood||"",data.symptoms?.hrv||"",data.symptoms?.rhr||""]);
      });
    });
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`protocol_${todayStr()}.csv`;a.click();
  };
  const expJSON=()=>{
    const s={version:"1.2",date:todayStr(),allData,customSupplements:customSupps,taskOverrides,customTasks};
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.download=`protocol_state_${todayStr()}.json`;a.click();
  };
  const impJSON=e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const s=JSON.parse(ev.target.result);
        if(s.allData)Object.entries(s.allData).forEach(([d,data])=>saveDay(d,data));
        if(s.customSupplements)lsSet("customSupplements2",s.customSupplements);
        if(s.taskOverrides)lsSet("taskOverrides",s.taskOverrides);
        if(s.customTasks)lsSet("customTasks",s.customTasks);
        alert("Import successful — please reload the app.");
      }catch{alert("Import failed — invalid JSON file");}
    };
    reader.readAsText(f);
  };
  return(
    <div style={{padding:14}}>
      <div className="ph"><div className="ptl">Settings</div><div className="ps">Export, import, and app info</div></div>
      <div className="sdv">Export</div>
      <button className="setb" onClick={expCSV}><span className="si">📊</span>Export logs as CSV</button>
      <button className="setb" onClick={expJSON}><span className="si">💾</span>Export full app state as JSON</button>
      <div className="sdv">Import</div>

// ─── MAIN APP ────────────────────────────────────────────────────────────────
const MENU=[
  {id:"today",label:"Today",icon:"🗓"},
  {id:"weekly",label:"Weekly Summary",icon:"📈"},
  {id:"diet",label:"Diet",icon:"🍲"},
  {id:"movement",label:"Movement",icon:"🌿"},
  {id:"breathwork",label:"Breathwork",icon:"🌬"},
  {id:"bodywork",label:"Bodywork",icon:"🤲"},
  {id:"dinacharya",label:"Dinacharya",icon:"🕯"},
  {id:"supplements",label:"Supplements",icon:"💊"},
  {id:"scent-sound",label:"Scent & Sound",icon:"🌸"},
  {id:"ayurveda",label:"Ayurveda Reference",icon:"🌀"},
  {id:"settings",label:"Settings",icon:"⚙️"},
];

function App(){
  const[mOpen,setMOpen]=useState(false);
  const[sec,setSec]=useState("today");
  const[date,setDate]=useState(todayStr());
  const[allData,setAllData]=useState({});
  const[sheet,setSheet]=useState(null);
  const[comment,setComment]=useState("");
  const[sheetTime,setSheetTime]=useState("");
  const[blockOpen,setBlockOpen]=useState(()=>lsGet("blockState",{morning:true,midday:true,afternoon:false,evening:false,winddown:false,night:false}));

  const{allTasks,resolvedTasks,customTasks,customSupps,updateTask,addCustomTask,addCustomSupp,updateCustomSupp,deleteCustomSupp,archiveTask,restoreTask,overrides}=useTaskLibrary();

  const today=todayStr();
  const minDate=fmtDate(new Date(Date.now()-7*86400000));

  useEffect(()=>{
    const loaded={};
    for(let i=0;i<30;i++){
      const d=fmtDate(new Date(Date.now()-i*86400000));
      const data=loadDay(d);
      if(Object.keys(data.completed||{}).length>0||Object.keys(data.symptoms||{}).length>0)loaded[d]=data;
    }
    setAllData(loaded);
  },[]);

  const dayData=allData[date]||{completed:{},comments:{},times:{},symptoms:{}};

  const upd=nd=>{const u={...allData,[date]:nd};setAllData(u);saveDay(date,nd);};
  
  const complete=id=>{
    const now=fmtTime(new Date());
    upd({...dayData,completed:{...dayData.completed,[id]:true},times:{...dayData.times,[id]:now}});
  };
  const undo=id=>{
    const c={...dayData.completed};const t={...dayData.times};
    delete c[id];delete t[id];
    upd({...dayData,completed:c,times:t});
  };
  const symChange=(k,v)=>upd({...dayData,symptoms:{...dayData.symptoms,[k]:v}});
  const symSave=id=>upd({...dayData,completed:{...dayData.completed,[id]:true},times:{...dayData.times,[id]:fmtTime(new Date())}});
  const saveComment=()=>{
    if(!sheet)return;
    upd({...dayData,comments:{...dayData.comments,[sheet.id]:comment},times:{...dayData.times,[sheet.id]:sheetTime||dayData.times?.[sheet.id]||""}});
  };

  const toggleBlock=id=>{
    const nb={...blockOpen,[id]:!(blockOpen[id]!==undefined?blockOpen[id]:(id==="morning"||id==="midday"))};
    setBlockOpen(nb);lsSet("blockState",nb);
  };

  const nav=dir=>{
    const d=new Date(date);d.setDate(d.getDate()+dir);
    const nd=fmtDate(d);if(nd>=minDate&&nd<=today)setDate(nd);
  };

  // Tasks shown in today — all active tasks + any one-time additions
  const todayExtraKey="todayExtras_"+date;
  const[todayExtras,setTodayExtras]=useState(()=>lsGet(todayExtraKey,[]));
  useEffect(()=>{setTodayExtras(lsGet(todayExtraKey,[]));},[ date]);

  const addToToday=(task)=>{
    // Mark as a one-time addition for today — place at top of its block
    const extras=lsGet(todayExtraKey,[]);
    if(!extras.find(e=>e.id===task.id)){
      const updated=[task,...extras];
      lsSet(todayExtraKey,updated);
      setTodayExtras(updated);
    }
  };

  // Build visible task list for today
  const todayTasks=BLOCKS.reduce((acc,block)=>{
    const blockExtras=todayExtras.filter(t=>t.block===block.id);
    const regularTasks=allTasks.filter(t=>t.block===block.id&&!t.hidden&&!t.archived);
    // Merge: extras at top, no duplicates
    const seen=new Set(blockExtras.map(t=>t.id));
    const merged=[...blockExtras,...regularTasks.filter(t=>!seen.has(t.id))];
    return{...acc,[block.id]:merged};
  },{});

  const flatTodayTasks=BLOCKS.flatMap(b=>todayTasks[b.id]||[]);

  const mand=flatTodayTasks.filter(t=>t.priority==="mandatory"&&t.category!=="tracking");
  const compMand=mand.filter(t=>dayData.completed?.[t.id]);
  const pct=mand.length>0?Math.round((compMand.length/mand.length)*100):0;
  const rec=flatTodayTasks.filter(t=>t.priority==="recommended"&&t.category!=="tracking");
  const compRec=rec.filter(t=>dayData.completed?.[t.id]);
  const opt=flatTodayTasks.filter(t=>t.priority==="optional"&&!t.hidden);
  const compOpt=opt.filter(t=>dayData.completed?.[t.id]);
  const circ=2*Math.PI*26,offset=circ-(pct/100)*circ;

  const handleEditTask=(id,changes)=>{
    // Check if it's a custom supplement
    if(customSupps.find(s=>s.id===id)){updateCustomSupp(id,changes);return;}
    updateTask(id,changes);
  };

  return(
    <>
      <style>{CSS}</style>
      <div className="app">
        <div className="topbar">
          <div className="tbt">{sec==="today"?getLabel(date):MENU.find(m=>m.id===sec)?.label}</div>
          <button className="hbtn" onClick={()=>setMOpen(true)}><span/><span/><span/></button>
        </div>

        <div className={`ov${mOpen?" open":""}`} onClick={()=>setMOpen(false)}/>
        <div className={`menu${mOpen?" open":""}`}>
          <div className="mhdr"><h2>Nelson's Protocol</h2><p>Integrated daily guide · v1.2</p></div>
          {MENU.map(m=><button key={m.id} className={`mi${sec===m.id?" act":""}`} onClick={()=>{setSec(m.id);setMOpen(false);}}><span className="mic">{m.icon}</span>{m.label}</button>)}
        </div>

        <div className="main">
          {sec==="today"&&<>
            <div className="dnav">
              <button className="dnb" onClick={()=>nav(-1)} disabled={date<=minDate}>‹</button>
              <div className="ddsp">
                <div className="dlbl">{getLabel(date)}</div>
                <div className="dfl">{new Date(date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
              </div>
              <button className="dnb" onClick={()=>nav(1)} disabled={date>=today}>›</button>
            </div>
            <div className="psec">
              <div className="rw">
                <svg width="60" height="60" viewBox="0 0 60 60">
                  <circle cx="30" cy="30" r="24" fill="none" stroke="#E8DDD0" strokeWidth="5"/>
                  <circle cx="30" cy="30" r="24" fill="none" stroke="#8B4A2A" strokeWidth="5" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{transition:"stroke-dashoffset .5s ease"}}/>
                </svg>
                <div className="rc">{pct}%</div>
              </div>
              <div className="pst">
                <div className="pt">Daily Progress</div>
                <div className="pn">{compMand.length} of {mand.length} mandatory</div>
                <div className="pbs">
                  <div className="pbi"><div className="pbl">Must</div><div className="pbt"><div className="pbf" style={{width:`${mand.length>0?(compMand.length/mand.length)*100:0}%`,background:"#8B4A2A"}}/></div></div>
                  <div className="pbi"><div className="pbl">Rec</div><div className="pbt"><div className="pbf" style={{width:`${rec.length>0?(compRec.length/rec.length)*100:0}%`,background:"#7A6230"}}/></div></div>
                  <div className="pbi"><div className="pbl">Opt</div><div className="pbt"><div className="pbf" style={{width:`${opt.length>0?(compOpt.length/opt.length)*100:0}%`,background:"#4A6B4A"}}/></div></div>
                </div>
              </div>
            </div>
            {BLOCKS.map(block=>(
              <TimeBlock
                key={block.id}
                block={block}
                tasks={todayTasks[block.id]||[]}
                dayData={dayData}
                blockOpen={blockOpen}
                onToggle={()=>toggleBlock(block.id)}
                onComplete={complete}
                onUndo={undo}
                onSheet={task=>{setSheet(task);setComment(dayData.comments?.[task.id]||"");setSheetTime(dayData.times?.[task.id]||"");}}
                onSymChange={symChange}
                onSymSave={symSave}
              />
            ))}
          </>}

          {sec==="weekly"&&<WeekTab allData={allData}/>}
          {sec==="diet"&&<DietTab allTasks={allTasks} onAddToday={addToToday} onEditTask={handleEditTask}/>}
          {sec==="movement"&&<MovTab allTasks={allTasks} onAddToday={addToToday} onEditTask={handleEditTask}/>}
          {sec==="breathwork"&&<BwTab allTasks={allTasks} onAddToday={addToToday} onEditTask={handleEditTask}/>}
          {sec==="bodywork"&&<BodyTab allTasks={allTasks} onAddToday={addToToday} onEditTask={handleEditTask}/>}
          {sec==="dinacharya"&&<DinaTab allTasks={allTasks} onAddToday={addToToday} onEditTask={handleEditTask}/>}
          {sec==="supplements"&&<SupplementsTab allTasks={allTasks} customSupps={customSupps} onAdd={addCustomSupp} onUpdate={updateCustomSupp} onDelete={deleteCustomSupp} onEditTask={handleEditTask}/>}
          {sec==="scent-sound"&&<ScentSoundTab/>}
          {sec==="ayurveda"&&<AyuTab/>}
          {sec==="settings"&&<SetTab allData={allData} customSupps={customSupps} taskOverrides={overrides} customTasks={customTasks}/>}
        </div>

        <Sheet
          task={sheet}
          open={!!sheet}
          onClose={()=>setSheet(null)}
          onComplete={id=>{complete(id);setSheet(null);}}
          comment={comment}
          onCC={setComment}
          onSave={saveComment}
          time={sheetTime}
          onTimeChange={setSheetTime}
          allTasks={allTasks}
        />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
