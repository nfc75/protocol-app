function useTimer(secs){
  const[s,setS]=useState(secs);const[run,setRun]=useState(false);const r=useRef(null);
  useEffect(()=>{
    if(run&&s>0){r.current=setInterval(()=>setS(x=>x-1),1000);}
    else{clearInterval(r.current);if(s===0)setRun(false);}
    return()=>clearInterval(r.current);
  },[run,s]);
  const fmt=x=>`${String(Math.floor(x/60)).padStart(2,"0")}:${String(x%60).padStart(2,"0")}`;
  return{display:fmt(s),running:run,done:s===0,start:()=>setRun(true),pause:()=>setRun(false),reset:()=>{setRun(false);setS(secs);}};
}

function Sheet({task,open,onClose,onComplete,comment,onCC,onSave}){
  const dur=pd(task?.duration||"");
  const timer=useTimer(dur||60);
  if(!task)return null;
  const cat=CATS[task.category];
  return <>
    <div className={`shov${open?" open":""}`} onClick={onClose}/>
    <div className={`sh${open?" open":""}`}>
      <div className="shh"/>
      <div className="shhdr"><div className="shtl">{cat?.icon} {task.name}</div><div className="shsb">{task.instruction} · {task.duration}</div></div>
      <div className="shbd">
        {dur>0&&<><div className="shlb">Timer</div><div className="tmd"><div className="tmt">{timer.display}</div><div className="tmc3">{!timer.running?<button className="tmb tmb-s" onClick={timer.start}>{timer.done?"Done!":"Start"}</button>:<button className="tmb tmb-p" onClick={timer.pause}>Pause</button>}<button className="tmb tmb-r" onClick={timer.reset}>Reset</button></div></div></>}
        {task.substitutions?.length>0&&<><div className="shlb" style={{marginTop:8}}>Swap With</div>{task.substitutions.map(sid=>{const sub=TASKS.find(t=>t.id===sid);if(!sub)return null;return <button key={sid} className="subb" onClick={()=>{onComplete(sub.id);onClose();}}><span>🔄</span><div><div className="subn">{sub.name}</div><div className="subd">{sub.instruction} · {sub.duration}</div></div></button>;})}</>}
        {task.videos?.length>0&&<><div className="shlb" style={{marginTop:8}}>Video Guides</div><div className="vls">{task.videos.map((u,i)=><a key={i} href={u} target="_blank" rel="noopener noreferrer" className="vl">▶ Video Guide {task.videos.length>1?i+1:""}</a>)}</div></>}

        <button className="shsv" onClick={()=>{onSave();onClose();}}>Save Comment</button>
        <button className="shdn" onClick={()=>{onComplete(task.id);onClose();}}>✓ Mark Complete</button>
      </div>
    </div>
  </>;
}

function Block({block,tasks,dayData,onComplete,onUndo,onSheet,onSymChange,onSymSave}){
  const[open,setOpen]=useState(block.id==="morning"||block.id==="midday");
  const bt=tasks.filter(t=>t.block===block.id&&!t.hidden);
  const mand=bt.filter(t=>t.priority==="mandatory"&&t.category!=="tracking");
  const comp=mand.filter(t=>dayData.completed?.[t.id]);
  const pct=mand.length>0?Math.round((comp.length/mand.length)*100):0;
  const all=pct===100&&mand.length>0;
  return <div className="tblk">
    <div className="bh" onClick={()=>setOpen(o=>!o)}>
      <div className="bhf" style={{transform:`scaleX(${pct/100})`}}/>
      <div className="bhl"><span className="be">{block.emoji}</span><div><div className="btl">{block.label}</div><div className="bti">{block.time}</div></div></div>
      <div className="bhr"><span className={`bp${all?" dn":""}`}>{all?"✓ Done":`${comp.length}/${mand.length}`}</span><span className={`bc${open?" op":""}`}>▼</span></div>
    </div>
    {open&&<div className="bts">
      {bt.map(task=>{
        if(task.category==="tracking"){
          const done=dayData.completed?.[task.id];
          const fields=task.id==="sym-morning"?MF:task.id==="sym-midday"?DF:EF;
          if(done)return <div key={task.id} className="tc2 cmp"><div className="tmin"><span className="tmc2">✓</span><span className="tmn">{task.name}</span><button className="tmu" onClick={()=>onUndo(task.id)}>undo</button></div></div>;
          return <SymLog key={task.id} title={task.name} fields={fields} data={dayData.symptoms||{}} onChange={onSymChange} onSave={()=>onSymSave(task.id)}/>;
        }
        const done=dayData.completed?.[task.id];
        const cat=CATS[task.category];
        if(done)return <div key={task.id} className="tc2 cmp"><div className="tmin"><span className="tmc2">✓</span><span className="tmn">{task.name}</span><button className="tmu" onClick={()=>onUndo(task.id)}>undo</button></div></div>;

function MovTab(){const p=TASKS.filter(t=>t.category==="movement"&&!t.hidden);return <div className="ref"><div className="ph"><div className="ptl">Movement</div><div className="ps">Vyayama — Vata-grounding</div></div><div className="rc3"><div className="rct">Principles</div><ul className="rl"><li>Train at ~50% max capacity on depleted days</li><li>Warm up 10 min minimum before every session</li><li>Slow eccentric — 3–4 sec on lowering phase</li><li>Enforce 2–3 min rest between heavy sets</li><li>Zone 2: stay nasal breathing throughout</li><li>Stop if: mouth breathing, joint dryness, fog increase</li></ul></div>{p.map(t=><div key={t.id} className="rc3"><div className="rct">{t.name}</div><div className="sm2">{t.instruction} · {t.duration} · <span className={`pb2 ${t.priority}`}>{PRI[t.priority]}</span></div>{t.videos?.map((u,i)=><a key={i} href={u} target="_blank" rel="noopener noreferrer" className="vl" style={{marginTop:8}}>▶ Video Guide {t.videos.length>1?i+1:""}</a>)}</div>)}</div>;}

function BwTab(){const p=TASKS.filter(t=>t.category==="breathwork"&&!t.hidden);return <div className="ref"><div className="ph"><div className="ptl">Breathwork</div><div className="ps">Pranayama — Vata regulation</div></div><div className="rc3"><div className="rct">Avoid These Practices</div><ul className="rl av"><li>Kapalabhati — strongly Vata aggravating</li><li>Wim Hof / hyperventilation — cortisol spike</li><li>Breath of Fire — depleting for your type</li><li>Long breath retentions — triggers anxiety in Vata</li></ul></div>{p.map(t=><div key={t.id} className="rc3"><div className="rct">{t.name}</div><div className="sm2">{t.instruction} · {t.duration} · <span className={`pb2 ${t.priority}`}>{PRI[t.priority]}</span></div>{t.videos?.map((u,i)=><a key={i} href={u} target="_blank" rel="noopener noreferrer" className="vl" style={{marginTop:8}}>▶ Video Guide {t.videos.length>1?i+1:""}</a>)}</div>)}</div>;}

function BodyTab(){const p=TASKS.filter(t=>t.category==="bodywork"&&!t.hidden);return <div className="ref"><div className="ph"><div className="ptl">Bodywork</div><div className="ps">Abhyanga and therapeutic bodywork</div></div><div className="rc3"><div className="rct">Abhyanga Sequence</div><ul className="rl"><li>Warm sesame oil — stand bottle in hot water 5 min</li><li>Crown and scalp — circular, 2 min</li><li>Neck and shoulders — upward strokes toward clavicle, 4 min</li><li>Arms — long strokes toward heart, 2 min</li><li>Abdomen — clockwise circles, 3 min</li><li>Back and lower back, 2 min</li><li>Legs — long strokes toward heart, 3 min</li><li>Feet — firm pressure on soles, 4 min</li><li>Leave on 10–15 min, then warm shower</li></ul></div><div className="rc3"><div className="rcs">Heating Device</div><ul className="rl"><li>15–20 min on neck/shoulders, morning or evening</li><li>Moist heat preferred — damp cloth between device and skin</li><li>Combine with Nadi Shodhana for amplified effect</li></ul></div><div className="rc3"><div className="rcs">Cooling Mask</div><ul className="rl"><li>During active headache or head pressure only</li><li>10–15 min max, lying down with legs elevated</li><li>Combine with Bhramari breathing</li><li>Do not use daily — restricts cervical lymphatic flow</li></ul></div>{p.map(t=><div key={t.id} className="rc3"><div className="rct">{t.name}</div><div className="sm2">{t.instruction} · {t.duration}</div>{t.videos?.map((u,i)=><a key={i} href={u} target="_blank" rel="noopener noreferrer" className="vl" style={{marginTop:8}}>▶ Video Guide {t.videos.length>1?i+1:""}</a>)}</div>)}</div>;}

function AyuTab(){return <div className="ref"><div className="ph"><div className="ptl">Ayurveda</div><div className="ps">Your constitutional assessment</div></div><div className="db"><div className="dp">Vata – Kapha</div><div className="ds2">Prakriti · Constitutional Type</div><div className="dd">Vata is dominant: lean frame, cold extremities, dry skin, racing mind, anxiety under stress. Kapha secondary — currently compensatory stagnation. Treatment targets the imbalance, not just the constitution.</div></div><div className="rc3"><div className="rct">Current Imbalance (Vikriti)</div><ul className="rl"><li>Vata severely aggravated — depleted Prana Vata</li><li>Kapha accumulation as compensatory response</li><li>Brain fog → disturbed Prana and Udana Vata</li><li>Cold extremities → Vyana Vata imbalance</li><li>Unrefreshing sleep → nervous system too dysregulated</li><li>Cervical tension → Vata dryness and constriction</li><li>Difficulty gaining muscle → Vata consumes tissue faster than built</li></ul></div><div className="rc3"><div className="rct">The Core Principle</div><div className="dd" style={{marginTop:0}}>Like increases like. Opposites create balance. Vata is dry, light, cold, mobile. Eat and live with the opposite: warm, heavy, oily, smooth, grounding. You need more of what you are missing, not more of what you already have in excess.</div></div><div className="rc3"><div className="rct">Vata Aggravators</div><ul className="rl av"><li>Irregular meal times and skipping meals</li><li>Irregular sleep and wake times</li><li>Cold, raw, dry foods</li><li>Excessive or depleting exercise</li><li>Overstimulation — screens, noise, multi-tasking</li><li>Cold environments without adequate warming</li><li>Rushing and erratic scheduling</li></ul></div><div className="rc3"><div className="rct">Key Herbs</div>{HERBS.map(h=><div key={h.name} className="hc" style={{marginBottom:8}}><div className="hn">{h.name}</div><div className="hm">{h.dose} · {h.timing}</div><div className="hp">{h.purpose}</div></div>)}</div></div>;}

function WeekTab({allData}){
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date(Date.now()-i*86400000);const ds=fd(d);
    const data=allData[ds]||{completed:{},symptoms:{}};
    const mand=TASKS.filter(t=>t.priority==="mandatory"&&t.category!=="tracking");
    const comp=mand.filter(t=>data.completed?.[t.id]);
    const pct=mand.length>0?Math.round((comp.length/mand.length)*100):0;
    days.push({ds,label:d.toLocaleDateString("en-GB",{weekday:"short"}),pct,sym:data.symptoms||{}});
  }
  const keys=[{key:"fog",label:"Fog",color:"#7A9BB5"},{key:"energy",label:"Energy",color:"#6B8F6B"},{key:"tension",label:"Tension",color:"#C4724A"},{key:"sleepQuality",label:"Sleep",color:"#9B8BB4"},{key:"mood",label:"Mood",color:"#C49A3A"}];
  return <div className="ref">
    <div className="ph"><div className="ptl">Weekly Summary</div><div className="ps">Last 7 days</div></div>
    <div className="rc3"><div className="rct">Protocol Completion</div><div className="wg" style={{marginTop:12}}>{days.map(day=><div key={day.ds} className="wdc"><div className="wdl">{day.label}</div><div className="wdb"><div className="wbf" style={{height:`${day.pct}%`,background:day.pct>70?"var(--fo)":day.pct>40?"var(--oc)":"var(--tc)"}}/></div><div className="wdp">{day.pct}%</div></div>)}</div></div>
    {keys.map(sk=>{
      const vals=days.map(d=>d.sym[sk.key]?Number(d.sym[sk.key]):null);
      if(!vals.some(v=>v!==null))return null;
      const w=100/7,pts=vals.map((v,i)=>v!==null?`${i*w+w/2},${((5-v)/4)*60+10}`:null).filter(Boolean);
      return <div key={sk.key} className="sch3"><div className="ctl">{sk.label}</div><div className="cls"><svg className="csvg" viewBox="0 0 100 80" preserveAspectRatio="none">{[1,2,3,4,5].map(v=><line key={v} x1="0" y1={((5-v)/4)*60+10} x2="100" y2={((5-v)/4)*60+10} stroke="rgba(154,138,120,.15)" strokeWidth="0.5"/>)}{pts.length>1&&<polyline points={pts.join(" ")} fill="none" stroke={sk.color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>}{vals.map((v,i)=>v!==null?<circle key={i} cx={i*w+w/2} cy={((5-v)/4)*60+10} r="2.5" fill={sk.color}/>:null)}</svg></div></div>;
    })}
  </div>;
}

function SetTab({allData,custom}){
  const expCSV=()=>{
    const rows=[["Date","Task","Completed","Comment","Fog","Energy","Tension","Sleep","Mood","HRV","RHR"]];
    Object.entries(allData).forEach(([date,data])=>{TASKS.forEach(t=>{if(data.completed?.[t.id])rows.push([date,t.name,"Yes",data.comments?.[t.id]||"",data.symptoms?.fog||"",data.symptoms?.energy||"",data.symptoms?.tension||"",data.symptoms?.sleepQuality||"",data.symptoms?.mood||"",data.symptoms?.hrv||"",data.symptoms?.rhr||""]);});});
    const csv=rows.map(r=>r.map(c=>`"${c}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`protocol_${fd(new Date())}.csv`;a.click();
  };
  const expJSON=()=>{
    const s={version:"1.0",date:fd(new Date()),allData,customSupplements:custom};
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.download=`protocol_state_${fd(new Date())}.json`;a.click();
  };
  const impJSON=e=>{
    const f=e.target.files[0];if(!f)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{const s=JSON.parse(ev.target.result);if(s.allData){Object.entries(s.allData).forEach(([d,data])=>sd(d,data));if(s.customSupplements)localStorage.setItem("customSupplements",JSON.stringify(s.customSupplements));alert("Import successful — please reload the app.");}else alert("Invalid file format");}catch{alert("Import failed — invalid JSON");}};
    reader.readAsText(f);
  };
  return <div style={{padding:16}}>
    <div className="ph"><div className="ptl">Settings</div><div className="ps">Export, import, and app info</div></div>
    <div className="sdv">Export</div>
    <button className="setb" onClick={expCSV}><span className="si">📊</span>Export logs as CSV</button>
    <button className="setb" onClick={expJSON}><span className="si">💾</span>Export full app state as JSON</button>
    <div className="sdv">Import</div>
    <label className="setb" style={{cursor:"pointer"}}><span className="si">📥</span>Import JSON (restore state)<input type="file" accept=".json" style={{display:"none"}} onChange={impJSON}/></label>
    <div className="sdv">About</div>
    <div className="rc3"><div className="rct">Nelson's Integrated Protocol</div><div className="sm2">Version 1.0 · PWA</div><div className="sp2">Integrates Ayurvedic practices, training protocol, supplement schedule, and daily wellness tracking.</div><div className="sp2" style={{marginTop:8,color:"var(--tc)"}}>📱 To install on iPhone: tap Share in Safari → Add to Home Screen</div></div>
  </div>;
}

const MENU=[
  {id:"today",label:"Today",icon:"🗓"},{id:"weekly",label:"Weekly Summary",icon:"📈"},
  {id:"diet",label:"Diet",icon:"🍲"},{id:"movement",label:"Movement",icon:"🌿"},
  {id:"breathwork",label:"Breathwork",icon:"🌬"},{id:"bodywork",label:"Bodywork",icon:"🤲"},
  {id:"supplements",label:"Supplements",icon:"💊"},{id:"ayurveda",label:"Ayurveda Reference",icon:"🌀"},
  {id:"settings",label:"Settings",icon:"⚙️"},
];

function App(){
  const[mOpen,setMOpen]=useState(false);
  const[sec,setSec]=useState("today");
  const[date,setDate]=useState(fd(new Date()));
  const[allData,setAllData]=useState({});
  const[sheet,setSheet]=useState(null);
  const[comment,setComment]=useState("");
  const[custom,setCustom]=useState([]);
  const today=fd(new Date());
  const minDate=fd(new Date(Date.now()-7*86400000));

  useEffect(()=>{
    const loaded={};
    for(let i=0;i<30;i++){const d=fd(new Date(Date.now()-i*86400000));const data=ld(d);if(Object.keys(data.completed||{}).length>0||Object.keys(data.symptoms||{}).length>0)loaded[d]=data;}
    setAllData(loaded);
    try{const cs=localStorage.getItem("customSupplements");if(cs)setCustom(JSON.parse(cs));}catch{}
  },[]);

  const dayData=allData[date]||{completed:{},comments:{},symptoms:{}};
  const upd=nd=>{const u={...allData,[date]:nd};setAllData(u);sd(date,nd);};
  const complete=id=>upd({...dayData,completed:{...dayData.completed,[id]:true}});
  const undo=id=>{const c={...dayData.completed};delete c[id];upd({...dayData,completed:c});};
  const symChange=(k,v)=>upd({...dayData,symptoms:{...dayData.symptoms,[k]:v}});
  const symSave=id=>upd({...dayData,completed:{...dayData.completed,[id]:true}});
  const saveComment=()=>{if(!sheet)return;upd({...dayData,comments:{...dayData.comments,[sheet.id]:comment}});};

  const mand=TASKS.filter(t=>t.priority==="mandatory"&&t.category!=="tracking");
  const compMand=mand.filter(t=>dayData.completed?.[t.id]);
  const pct=mand.length>0?Math.round((compMand.length/mand.length)*100):0;
  const rec=TASKS.filter(t=>t.priority==="recommended"&&t.category!=="tracking");
  const compRec=rec.filter(t=>dayData.completed?.[t.id]);
  const opt=TASKS.filter(t=>t.priority==="optional"&&!t.hidden);
  const compOpt=opt.filter(t=>dayData.completed?.[t.id]);
  const circ=2*Math.PI*26,offset=circ-(pct/100)*circ;
  const visible=TASKS.filter(t=>!t.hidden);
  const nav=dir=>{const d=new Date(date);d.setDate(d.getDate()+dir);const nd=fd(d);if(nd>=minDate&&nd<=today)setDate(nd);};
  const addCustom=s=>{const u=[...custom,s];setCustom(u);localStorage.setItem("customSupplements",JSON.stringify(u));};
  const togCustom=id=>{const u=custom.map(s=>s.id===id?{...s,active:!s.active}:s);setCustom(u);localStorage.setItem("customSupplements",JSON.stringify(u));};

  return <>
    <style>{CSS}</style>
    <div className="app">
      <div className="topbar">
        <div className="tbt">{sec==="today"?gl(date):MENU.find(m=>m.id===sec)?.label}</div>
        <button className="hbtn" onClick={()=>setMOpen(true)}><span/><span/><span/></button>
      </div>
      <div className={`ov${mOpen?" open":""}`} onClick={()=>setMOpen(false)}/>
      <div className={`menu${mOpen?" open":""}`}>
        <div className="mhdr"><h2>Nelson's Protocol</h2><p>Integrated daily guide</p></div>
        {MENU.map(m=><button key={m.id} className={`mi${sec===m.id?" act":""}`} onClick={()=>{setSec(m.id);setMOpen(false);}}><span className="mic">{m.icon}</span>{m.label}</button>)}
      </div>
      <div className="main">
        {sec==="today"&&<>
          <div className="dnav">
            <button className="dnb" onClick={()=>nav(-1)} disabled={date<=minDate}>‹</button>
            <div className="ddsp"><div className="dlbl">{gl(date)}</div><div className="dfl">{new Date(date+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})}</div></div>
            <button className="dnb" onClick={()=>nav(1)} disabled={date>=today}>›</button>
          </div>
          <div className="psec">
            <div className="rw">
              <svg width="64" height="64" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="26" fill="none" stroke="var(--crd)" strokeWidth="6"/>
                <circle cx="32" cy="32" r="26" fill="none" stroke="var(--tc)" strokeWidth="6" strokeDasharray={circ} strokeDashoffset={offset} strokeLinecap="round" style={{transition:"stroke-dashoffset .5s ease"}}/>
              </svg>
              <div className="rc">{pct}%</div>
            </div>
            <div className="pst">
              <div className="pt">Daily Progress</div>
              <div className="pn">{compMand.length} of {mand.length} mandatory</div>
              <div className="pbs">
                <div className="pbi"><div className="pbl">Must</div><div className="pbt"><div className="pbf" style={{width:`${mand.length>0?(compMand.length/mand.length)*100:0}%`,background:"var(--tc)"}}/></div></div>
                <div className="pbi"><div className="pbl">Rec</div><div className="pbt"><div className="pbf" style={{width:`${rec.length>0?(compRec.length/rec.length)*100:0}%`,background:"var(--oc)"}}/></div></div>
                <div className="pbi"><div className="pbl">Opt</div><div className="pbt"><div className="pbf" style={{width:`${opt.length>0?(compOpt.length/opt.length)*100:0}%`,background:"var(--fo)"}}/></div></div>
              </div>
            </div>
          </div>
          {BLOCKS.map(b=><Block key={b.id} block={b} tasks={visible} dayData={dayData} onComplete={complete} onUndo={undo} onSheet={t=>{setSheet(t);setComment(dayData.comments?.[t.id]||"");}} onSymChange={symChange} onSymSave={symSave}/>)}
        </>}
        {sec==="weekly"&&<WeekTab allData={allData}/>}
        {sec==="diet"&&<DietTab/>}
        {sec==="movement"&&<MovTab/>}
        {sec==="breathwork"&&<BwTab/>}
        {sec==="bodywork"&&<BodyTab/>}
        {sec==="supplements"&&<SupTab custom={custom} onAdd={addCustom} onToggle={togCustom}/>}
        {sec==="ayurveda"&&<AyuTab/>}
        {sec==="settings"&&<SetTab allData={allData} custom={custom}/>}
      </div>
      <Sheet task={sheet} open={!!sheet} onClose={()=>setSheet(null)} onComplete={id=>{complete(id);setSheet(null);}} comment={comment} onCC={setComment} onSave={saveComment}/>
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
